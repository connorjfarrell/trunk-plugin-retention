[package]
# Your plugin's id: lowercase letters, digits and dashes. It names the
# executable, the release files and the plugin's entry in the registry.
name = "retention"
version = "0.1.0"
edition = "2024"
description = "Deletes the oldest calls from the recordings folder past an age, a size or a share of the disk."
license = "MIT"
repository = "https://github.com/connorjfarrell/trunk-plugin-retention"
authors = ["Connor Farrell"]
publish = false

[dependencies]
trunk-recorder-plugin = "0.8.0"
# The settings form is drawn from your config structs' JSON Schema. Keep the
# major version the SDK uses (1).
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = { version = "0.39", default-features = false, features = ["disk"] }

[profile.release]
strip = true
lto = true
